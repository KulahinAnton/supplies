name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A second push supersedes the first: no point finishing a run for a commit
  # nobody will merge.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # The smoke test needs a real Postgres. This is the reason it belongs in
      # CI rather than in the pre-commit hook, where a stopped Docker daemon
      # would fail an honest commit.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: supplies
          POSTGRES_PASSWORD: supplies
          POSTGRES_DB: supplies
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supplies"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://supplies:supplies@localhost:5432/supplies
      # Auth.js needs a secret to boot; this one is CI-only and worthless.
      AUTH_SECRET: ci-only-not-a-real-secret-000000000000000
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The root tsconfig does not cover the apps — each has its own compiler
      # settings, and `pnpm verify` runs both. CI ran only the first, so an
      # error in apps/mobile or apps/spa reached a reviewer as a green tick.
      - name: Typecheck each app
        run: pnpm -r --filter "./apps/*" typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration smoke test
        run: pnpm test:db

      # The API against the same seeded database — 50 checks, including the
      # wire contracts every client's types are inferred from. Before the
      # builds, because a broken contract should fail in seconds rather than
      # after two production builds and two browsers.
      - name: API end-to-end and contract tests
        run: pnpm test:api:e2e

      # Before the e2e run, which serves this build rather than compiling its
      # own. `prisma generate` runs as part of the build script.
      - name: Build
        run: pnpm build

      # Chromium only: the "mobile" project runs the same specs in the same
      # engine at a phone viewport, so downloading a second browser would test
      # Playwright's device emulation rather than this app.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: End-to-end tests — the Next app
        run: pnpm test:e2e
        env:
          AUTH_TRUST_HOST: "true"

      # The SPA starts its own API on 3210 and serves its own build on 4173,
      # so it shares nothing with the step above but the database.
      - name: End-to-end tests — the SPA
        run: pnpm test:e2e:spa

      # Only on failure — a green run should leave nothing to look at.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            apps/spa/playwright-report/
            apps/spa/test-results/
          retention-days: 7

  # apps/mobile, which needs no database and shares nothing with the job above.
  # Separate so its failure says "the phone app" rather than being the
  # fourteenth step of something else.
  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This is the check that would have caught an EAS build failing on a
      # missing peer dependency, two hours before the build did. It also names
      # config keys the SDK has dropped and packages that have drifted from the
      # versions it expects.
      - name: Expo doctor
        working-directory: apps/mobile
        run: npx --yes expo-doctor

      # Resolves the entire module graph and writes a Hermes bundle with no
      # device attached, which is how a Metro resolution mistake surfaces in
      # seconds rather than on a phone. pnpm does not hoist, so an undeclared
      # dependency that happens to resolve on one machine fails here.
      - name: Android bundle
        run: pnpm mobile:bundle
