# The root is the workspace and nothing else. Every deployable is under
# `apps/`, including the Next.js app, which moved out of the root on
# 2026-09-06 (SPA_API_PORT.md decision 8).
#
# `bot` is a package rather than a loose folder because `apps/web` imports the
# digest from it — the cron route sends it — and a relative path out of an app
# and back into a sibling directory is the kind of import that survives one
# refactor and not two.
packages:
  - packages/*
  - apps/*
  - bot

allowBuilds:
  sharp: true
  unrs-resolver: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  '@parcel/watcher': true
  '@swc/core': true
  # Telemetry beacon pulled in transitively. Declined: it phones home on
  # install and nothing here needs it.
  '@scarf/scarf': false
