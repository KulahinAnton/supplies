# The Next.js app is the ROOT package, deliberately — not `apps/web`.
#
# Moving it would change Vercel's Root Directory, and SPA_API_PORT.md Phase 0
# is meant to be additive: nothing before Phase 4.1 touches the running
# deployment. The clean `apps/*` layout arrives once the API, SPA and mobile
# app are proven, not before.
packages:
  - packages/*
  - apps/*

allowBuilds:
  sharp: true
  unrs-resolver: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  '@parcel/watcher': true
  '@swc/core': true
  # Telemetry beacon pulled in transitively. Declined: it phones home on
  # install and nothing here needs it.
  '@scarf/scarf': false
