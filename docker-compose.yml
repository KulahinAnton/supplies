services:
  db:
    image: postgres:17-alpine
    container_name: supplies-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplies
    ports:
      # 5434 on the host — 5432 is AquaBill's, 5433 is Kvartal's.
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplies"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
